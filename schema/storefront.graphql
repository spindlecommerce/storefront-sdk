type CartNotReadyError implements Error {
  code: ErrorCode

  """
  The same, field by field. Paths follow the storefront's cartUpdate input: ["shippingAddress", "address", "postalCode"] is a postal code still to give.
  """
  fieldErrors: [FieldError!]
  message: String
  missing: [CartRequirement!]
}

