"""
A page built from components. Storefronts get the published version, or the draft with a preview token.
"""
type Page implements Node {
  """
  The component tree in the request locale: { id, component, variation, fields }, with blocks fields holding child nodes and list fields holding { id, fields } items. Hidden components and those not targeted at this channel, locale or time are left out. Links are { kind, href, id, newTab }; products and categories are global ids, resolved in references.
  """
  content: JSON
  id: ID!

  """
  True when this is unpublished draft content, served for a preview token.
  """
  isPreview: Boolean

  """
  Where the page is served; null for content types without paths (header, footer, templates).
  """
  path: String
  publishedAt: DateTime
  references: PageReferences

  """
  Set for a product's or category's own sections (Product.sections, Category.sections): which of the two they belong to.
  """
  sectionsFor: TemplateFor
  seo: PageSeo

  """
  Set for templates: product or category pages render with this page, with the product or category as data for its components.
  """
  templateFor: TemplateFor
  title: String

  """The content type's code, e.g. landing_page."""
  type: String
  updatedAt: DateTime
}

type PageImage {
  alt: String
  height: Int
  url: String
  width: Int
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""A page linked from content: where it is served and its title."""
type PageLink {
  id: ID
  path: String
  title: String
}

"""
Objects the content refers to by id, so one request renders the whole page.
"""
type PageReferences {
  categories: [Category!]
  pages: [PageLink!]

  """
  Products the storefront may show; unpublished ones are left out (render nothing for them).
  """
  products: [Product!]
}

"""Search and sharing metadata, in the request locale."""
type PageSeo {
  description: String
  image: PageImage
  noIndex: Boolean

  """Falls back to nothing; frontends usually use the page title."""
  title: String
}

enum PageSort {
  """By path (the site's structure)."""
  PATH

  """
  Most recently changed first (admin: draft saves; storefront: publishes).
  """
  UPDATED
}

enum PageStatus {
  """Live, with draft changes not yet published."""
  CHANGED

  """Never published."""
  DRAFT

  """Live, with no unpublished changes."""
  PUBLISHED

  """Will publish at scheduledAt."""
  SCHEDULED
}

"""
Provider-specific payment data, e.g. a tokenized card from the PSP's client SDK. Never raw card numbers.
"""
input PaymentDataInput {
  token: String
}

type PaymentDeclinedError implements Error {
  code: ErrorCode
  declineCode: String
  message: String
}

type PaymentMethodOption {
  code: String
  instructions: String
  name: String

  """The payment provider behind the method, e.g. stripe, offline."""
  provider: String

  """
  Start a payment session (cartPaymentSessionCreate) and confirm the payment in the browser before placing the order.
  """
  sessionRequired: Boolean
}

enum PaymentStatus {
  AUTHORIZED
  PAID
  PARTIALLY_PAID
  PARTIALLY_REFUNDED

  """Awaiting payment (e.g. bank transfer)."""
  PENDING
  REFUNDED
  VOIDED
}

type PermissionDeniedError implements Error {
  code: ErrorCode
  message: String
  permission: String
}

"""
A preview of draft content. In the storefront API this describes the request's x-preview-token.
"""
type PreviewSession {
  """
  The admin's origin: the only window the visual editing bridge talks to.
  """
  adminOrigin: String

  """Scheduled content is shown as of this time."""
  at: String
  expiresAt: DateTime
}

"""Inclusive bounds in the request currency."""
input PriceFilterInput {
  max: Decimal
  min: Decimal
}

type PriceRange {
  maximum: Money
  minimum: Money
}

type Product implements Node {
  """Product-level attributes (variant axes are under `options`)."""
  attributes: [ProductAttribute!]
  categories: [Category!]
  createdAt: DateTime

  """HTML."""
  description: String
  id: ID!

  """Whether any variant can be bought now."""
  isAvailable: Boolean
  media: [Media!]
  name: String
  options: [ProductOption!]
  priceRange: ProductPriceRange

  """
  This product's own sections, to render with the product as data where its template places the product sections component. Null when it has none. Drafts appear only with a preview token.
  """
  sections: Page
  seo: Seo
  slug: String

  """
  The page builder template for this product's page: the one assigned to the product, else its nearest category's, else the default. Render its content with the product as data. Null means none: use your built-in layout. Drafts appear only with a preview token.
  """
  template: Page

  """
  The variant matching every selected option, e.g. color=blue and size=m.
  """
  variant(selectedOptions: [SelectedOptionInput!]!): ProductVariant
  variants: [ProductVariant!]
}

"""A typed attribute value, already formatted for the request locale."""
type ProductAttribute {
  attribute: AttributeDefinition

  """Selected options for select and multiselect attributes."""
  options: [AttributeOption!]
  raw: JSON

  """Display value, e.g. "Organic cotton" or "Blue, Green"."""
  value: String
}

type ProductConnection {
  edges: [ProductEdge]

  """
  Counts per filterable attribute value. Disjunctive: selecting a value keeps its siblings' counts.
  """
  facets: [Facet!]
  pageInfo: PageInfo!

  """
  Price span of all matches, ignoring the price filter (for range sliders).
  """
  priceRange: PriceRange

  """Total matching items across all pages."""
  totalCount: Int
}

type ProductEdge {
  cursor: String!
  node: Product
}

input ProductFilter {
  """Values within one attribute are ORed; attributes are ANDed."""
  attributes: [AttributeFilterInput!]

  """Includes products in descendant categories."""
  categoryId: ID
  ids: [ID!]
  inStock: Boolean
  price: PriceFilterInput
}

"""
A variant axis (e.g. Size) with the values that exist among the product's variants.
"""
type ProductOption {
  attribute: AttributeDefinition
  values: [AttributeOption!]
}

"""Prices for the request's channel, currency and customer group."""
type ProductPriceRange {
  compareAtMinVariantPrice: Money
  maxVariantPrice: Money
  minVariantPrice: Money
}

enum ProductSortField {
  """
  A category's merchandised listing: its pinned products in order, then the rest newest first. Elsewhere, newest first. Storefront only.
  """
  FEATURED
  NAME
  NEWEST
  PRICE
  RELEVANCE
}

input ProductSortInput {
  """
  Defaults to DESC for NEWEST and RELEVANCE (newest, best match first) and ASC for NAME and PRICE. FEATURED ignores it.
  """
  direction: SortDirection
  field: ProductSortField!
}

type ProductVariant implements Node {
  compareAtPrice: Money
  id: ID!
  isAvailable: Boolean
  media: [Media!]

  """
  Product name with the variant's options, e.g. "Oxford Shirt – Blue / M".
  """
  name: String
  price: Money
  product: Product

  """
  Salable quantity in the channel's stock; null when the variant does not track inventory.
  """
  quantityAvailable: Int
  selectedOptions: [SelectedOption!]
  sku: String
  tierPrices: [TierPrice!]
  weightGrams: Int
}

"""Entry point for reads."""
type Query {
  """All attribute definitions, e.g. to render filters."""
  attributeDefinitions: [AttributeDefinition!]
  cart(id: ID!): Cart
  category(id: ID, slug: String): Category

  """Root categories; walk `children` for the tree."""
  categoryTree: [Category!]

  """Order status for guests: all three values must match."""
  guestOrder(email: EmailAddress!, number: String!, postalCode: String!): Order
  localization: Localization

  """The signed-in customer, or null for anonymous requests."""
  me: Customer

  """Refetch any object by its global id."""
  node(id: ID!): Node

  """Refetch several objects by global id, in order."""
  nodes(ids: [ID!]!): [Node]!

  """By number. Storefront: the signed-in customer's orders only."""
  order(number: String!): Order

  """
  Storefront: the page served at a path (draft content with a preview token). Admin: by id or path.
  """
  page(id: ID, path: String): Page

  """
  Pages by path. Storefront: published pages served in the channel (e.g. for a sitemap or a journal index). Admin: every page; status filters the admin list.
  """
  pages(
    after: String
    before: String
    first: Int
    last: Int

    """Part of the path or title."""
    query: String

    """Defaults to PATH."""
    sort: PageSort

    """Admin only; the storefront lists published pages."""
    status: PageStatus

    """A content type's code."""
    type: String
  ): QueryPagesConnection

  """
  The request's preview, from its x-preview-token header; null without one. Frontends call it to validate a token before enabling draft mode.
  """
  previewSession: PreviewSession

  """
  Look up a product by exactly one of id, slug (in the request locale) or a variant SKU.
  """
  product(id: ID, sku: String, slug: String): Product

  """
  Storefront: full-text search with facets over the channel's published catalog. Admin: every product, newest first, or by name or lowest base price with `sort`.
  """
  products(
    after: String
    before: String
    filter: ProductFilter
    first: Int
    last: Int

    """Full-text search with prefix matching, e.g. "trail run"."""
    query: String

    """
    Defaults to RELEVANCE with a query, then to FEATURED in a category's listing, otherwise NEWEST.
    """
    sort: ProductSortInput
  ): ProductConnection

  """
  What a storefront path serves: a builder page at exactly that path; a product at /products/<slug> or a category at /categories/<slug path>, redirecting when a slug moved or the parents differ; otherwise a product or category by the last segment, else a redirect.
  """
  route(path: String!): RouteResult

  """
  The one page of a singleton content type, e.g. site_header or site_footer.
  """
  singletonPage(type: String!): Page
}

type QueryPagesConnection {
  edges: [QueryPagesConnectionEdge]
  pageInfo: PageInfo!

  """Total matching items across all pages."""
  totalCount: Int
}

type QueryPagesConnectionEdge {
  cursor: String!
  node: Page
}

"""The path moved; send the shopper to `location`."""
type Redirect {
  location: String
  statusCode: Int
}

"""A refund: money returned to the customer."""
type Refund {
  amount: Money
  createdAt: DateTime
  id: ID
  lines: [RefundLine!]
  number: String
  reason: String
  shippingAmount: Money
}

type RefundLine {
  amount: Money
  orderLine: OrderLine
  quantity: Int
  restocked: Boolean
}

union RouteResult = Category | Page | Product | Redirect

"""One variant axis value, e.g. Color: Blue."""
type SelectedOption {
  """Attribute code, e.g. color."""
  attribute: String

  """Option label in the request locale."""
  label: String

  """Attribute label in the request locale."""
  name: String
  swatch: String

  """Option code, e.g. blue."""
  value: String
}

input SelectedOptionInput {
  attribute: String!
  value: String!
}

type Seo {
  description: String
  title: String
}

"""
A signed-in session: a short-lived access token and a single-use refresh token.
"""
type Session {
  accessToken: String
  accessTokenExpiresAt: DateTime
  refreshToken: String
  refreshTokenExpiresAt: DateTime
}

type SessionPayload {
  session: Session
}

type ShippingRate {
  carrier: String
  code: String
  description: String
  maxDeliveryDays: Int
  minDeliveryDays: Int
  name: String
  price: Money
}

enum SortDirection {
  ASC
  DESC
}

"""Live updates over Server-Sent Events."""
type Subscription {
  """
  Status changes of one of the signed-in customer's orders, after they commit.
  """
  orderUpdated(orderId: ID!): OrderUpdate
}

type TaxLine {
  amount: Money
  name: String

  """Percent."""
  rate: Float
}

"""What a template renders: product pages or category pages."""
enum TemplateFor {
  CATEGORY
  PRODUCT
}

type TierPrice {
  minQuantity: Int
  price: Money
}

union TokenRefreshResult = AuthenticationError | NotFoundError | PermissionDeniedError | SessionPayload | ValidationError

type TrackingNumber {
  carrier: String
  number: String
  url: String
}

type ValidationError implements Error {
  code: ErrorCode
  fieldErrors: [FieldError!]
  message: String
}
