"""
Implemented by every expected failure. Query `... on Error { code message }` to handle any of them.
"""
interface Error {
  code: ErrorCode
  message: String
}

"""Stable machine-readable error codes."""
enum ErrorCode {
  CART_NOT_READY
  CONFLICT
  COUPON_NOT_APPLICABLE
  INSUFFICIENT_STOCK
  INVALID_STATE
  NOT_FOUND
  PAYMENT_DECLINED
  PERMISSION_DENIED
  UNAUTHENTICATED
  VALIDATION_FAILED
}

