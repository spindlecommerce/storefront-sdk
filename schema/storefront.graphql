union CartCouponRemoveResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

input CartCreateInput {
  email: EmailAddress
  lines: [CartLineInput!]
}

union CartCreateResult = AuthenticationError | CartPayload | InsufficientStockError | NotFoundError | PermissionDeniedError | ValidationError

union CartEmailUpdateResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

