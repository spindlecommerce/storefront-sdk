}

union CartPaymentMethodSetResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

"""
The payment the cart's provider prepared for its current total, for the provider's own payment form in the browser.
"""
type CartPaymentSession {
  amount: Money

  """
  Provider data for the browser, e.g. Stripe's { clientSecret, publishableKey }.
