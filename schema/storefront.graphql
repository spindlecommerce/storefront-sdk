"""
Run the operation in a channel, locale and currency. Overrides the X-Channel, Accept-Language and X-Currency headers.
"""
directive @inContext(
  """Channel code, e.g. eu."""
  channel: String

  """ISO 4217 code, e.g. GBP."""
  currency: String

  """BCP 47 locale, e.g. de-DE."""
  locale: String
) on MUTATION | QUERY | SUBSCRIPTION

type AcceptedPayload {
  accepted: Boolean
}

type Address {
  city: String
  company: String
  countryCode: CountryCode
  firstName: String
  lastName: String
  line1: String
  line2: String
  phone: String
  postalCode: String
  region: String
  regionCode: String
}

"""
An address as far as it is filled in: the country, and any of the rest. Blank fields are left out.
"""
input AddressDraftInput {
  city: String
  company: String
  countryCode: CountryCode!
  firstName: String
  lastName: String
  line1: String
  line2: String
  phone: String
  postalCode: String
  region: String
  regionCode: String
}

input AddressInput {
  city: String!
  company: String
  countryCode: CountryCode!
  firstName: String!
  lastName: String!
  line1: String!
  line2: String
  phone: String
