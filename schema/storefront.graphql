  currencyCode: CurrencyCode

  """Formatted for the request locale, e.g. "19,99 €"."""
  formatted: String
}

"""
Entry point for writes. Every mutation returns a result union: the payload or a typed error.
"""
type Mutation {
  """
  Adopt a guest cart after sign-in, merging it into the customer's open cart if there is one.
  """
  cartAssignToCustomer(cartId: ID!): CartAssignToCustomerResult
  cartBillingAddressSet(address: CartBillingAddressInput!, cartId: ID!): CartBillingAddressSetResult @deprecated(reason: "Use cartUpdate, which sets any checkout details in one call and takes incomplete addresses.")

  """
  Fails with CouponNotApplicableError (and a reason) unless the coupon is valid and its promotion applies to the cart.
  """
  cartCouponApply(cartId: ID!, code: String!): CartCouponApplyResult
  cartCouponRemove(cartId: ID!, code: String!): CartCouponRemoveResult

  """
  Create a cart in the request's channel and currency; signed-in customers own it.
  """
  cartCreate(input: CartCreateInput): CartCreateResult
  cartEmailUpdate(cartId: ID!, email: EmailAddress!): CartEmailUpdateResult @deprecated(reason: "Use cartUpdate, which sets any checkout details in one call and takes incomplete addresses.")

  """
  Add variants; quantities add up for variants already in the cart. Checked against salable stock.
  """
  cartLinesAdd(cartId: ID!, lines: [CartLineInput!]!): CartLinesAddResult
  cartLinesRemove(cartId: ID!, lineIds: [ID!]!): CartLinesRemoveResult
  cartLinesUpdate(cartId: ID!, lines: [CartLineUpdateInput!]!): CartLinesUpdateResult
  cartPaymentMethodSet(cartId: ID!, paymentMethodCode: String!): CartPaymentMethodSetResult @deprecated(reason: "Use cartUpdate, which sets any checkout details in one call and takes incomplete addresses.")

  """
  Start the payment with the selected method's provider for the cart's total (e.g. a Stripe PaymentIntent) when its sessionRequired is true. Call again after the total changes to update the same payment. See docs/payments.md.
  """
  cartPaymentSessionCreate(cartId: ID!): CartPaymentSessionCreateResult
  cartShippingAddressSet(address: CartAddressInput!, cartId: ID!): CartShippingAddressSetResult @deprecated(reason: "Use cartUpdate, which sets any checkout details in one call and takes incomplete addresses.")
  cartShippingMethodSet(cartId: ID!, shippingMethodCode: String!): CartShippingMethodSetResult @deprecated(reason: "Use cartUpdate, which sets any checkout details in one call and takes incomplete addresses.")

  """
  Set any checkout details, in any order and as often as the shopper changes them. Addresses may be incomplete: rates and tax follow once the shipping address has a country and postal code, and checkout reports the rest (CartNotReadyError.fieldErrors). The cheapest rate is selected until the shopper picks one; billing follows shipping unless the cart has its own. Every invalid field is reported at once; nothing is saved unless all are valid.
  """
  cartUpdate(cartId: ID!, input: CartUpdateInput!): CartUpdateResult

  """
  Turn a ready cart into an order: re-price, reserve stock, authorize payment. `input` is saved first, as cartUpdate saves it, so one call can do everything. Retries return the same order: with the same idempotencyKey, or any key once the cart is an order. A declined payment releases stock and reopens the cart. With a payment session, confirm the payment in the browser first and pass an empty payment.
  """
  checkoutPlaceOrder(
    cartId: ID!

    """Client-generated, e.g. a UUID per checkout attempt."""
    idempotencyKey: String!

    """Checkout details to save before placing the order."""
    input: CartUpdateInput
    payment: PaymentDataInput
  ): CheckoutPlaceOrderResult

  """
  Storefront: the signed-in customer's address book. Admin: any customer's, by customerId.
  """
  customerAddressCreate(input: CustomerAddressInput!): CustomerAddressCreateResult
  customerAddressDelete(id: ID!): CustomerAddressDeleteResult
  customerAddressUpdate(id: ID!, input: CustomerAddressInput!): CustomerAddressUpdateResult

  """Sign in. A guest cartId is merged into the customer's open cart."""
  customerLogin(cartId: ID, email: EmailAddress!, password: String!): CustomerLoginResult
  customerPasswordChange(currentPassword: String!, newPassword: String!): CustomerPasswordChangeResult

  """
  Set a new password with a reset token. Signs the customer out everywhere.
  """
  customerPasswordReset(newPassword: String!, token: String!): CustomerPasswordResetResult

  """
  Always accepted, never revealing whether the account exists. Emits customer.password_reset_requested to plugins (the email plugin sends the link), not webhooks.
  """
  customerPasswordResetRequest(email: EmailAddress!): CustomerPasswordResetRequestResult

  """Create an account and sign in. Pass a guest cartId to keep the cart."""
  customerRegister(cartId: ID, input: CustomerRegisterInput!): CustomerRegisterResult

  """
  Storefront: update the signed-in customer. Admin: update any customer by id.
  """
  customerUpdate(input: CustomerUpdateInput!): CustomerUpdateResult

  """Revoke the refresh token and every token rotated from it."""
  logout(refreshToken: String!): LogoutResult

  """
  Cancel an unshipped, uncaptured order (customers: their own). Voids the authorization and releases reserved stock.
  """
  orderCancel(orderId: ID!, reason: String): OrderCancelResult

  """
  Exchange a refresh token for a new session. Refresh tokens are single use; replaying one revokes the whole session family.
  """
  tokenRefresh(refreshToken: String!): TokenRefreshResult
}

