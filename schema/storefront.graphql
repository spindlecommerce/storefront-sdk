"""Something a cart still needs before it can be checked out."""
enum CartRequirement {
  BILLING_ADDRESS
  EMAIL
  LINES

  """A line is unavailable, unpriced or short on stock."""
  LINE_ISSUES
  PAYMENT_METHOD
  SHIPPING_ADDRESS
  SHIPPING_METHOD
}

union CartShippingAddressSetResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

union CartShippingMethodSetResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

"""
Exactly one: an address, complete or not, or a saved address of the signed-in customer.
"""
input CartUpdateAddressInput @oneOf {
  address: AddressDraftInput
  customerAddressId: ID
}

"""
Exactly one: an address, complete or not, a saved address of the signed-in customer, or sameAsShipping: true to bill to the shipping address.
"""
input CartUpdateBillingAddressInput @oneOf {
  address: AddressDraftInput
  customerAddressId: ID
  sameAsShipping: Boolean
}

"""
Checkout details to set, in any combination. Omitted fields stay as they are; null clears one.
"""
input CartUpdateInput {
  billingAddress: CartUpdateBillingAddressInput

  """
  Switch to another of the channel's currencies (Channel.currencies). Prices, shipping and tax follow; a chosen shipping or payment method no longer offered is dropped.
  """
  currencyCode: CurrencyCode
  email: EmailAddress

  """
  Move the cart to another of its channel's languages (Channel.locales): line names, and the emails for its order.
  """
  locale: LocaleCode

  """A code from availablePaymentMethods."""
  paymentMethodCode: String
  shippingAddress: CartUpdateAddressInput

  """
  A code from availableShippingMethods. Null goes back to the cheapest rate.
  """
  shippingMethodCode: String
}

union CartUpdateResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

type Category implements Node {
  """Root first, for breadcrumbs. Excludes this category."""
  ancestors: [Category!]
  children: [Category!]
  depth: Int
  description: String
  id: ID!
  name: String
  parent: Category

  """Slugs from the root, e.g. "men/mens-shirts"."""
  path: String
  position: Int
  products(
    after: String
    before: String
    filter: ProductFilter
    first: Int
    last: Int

    """Full-text search with prefix matching, e.g. "trail run"."""
    query: String

    """
    Defaults to RELEVANCE with a query, then to FEATURED in a category's listing, otherwise NEWEST.
    """
    sort: ProductSortInput
  ): ProductConnection

  """
  This category's own sections, to render with the category as data where its template places the category sections component. Null when it has none. Drafts appear only with a preview token.
  """
  sections: Page
  slug: String

  """
  The page builder template for this category's page: the one assigned to the category, else the default. Render its content with the category as data. Null means none: use your built-in layout. Drafts appear only with a preview token.
  """
  template: Page
}

