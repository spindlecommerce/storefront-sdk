type AuthenticationError implements Error {
  code: ErrorCode
  message: String
}

"""
Guest carts are addressed by their unguessable id; a customer's cart is visible only to that customer.
"""
type Cart implements Node {
  availablePaymentMethods: [PaymentMethodOption!]

  """
  Rates for the current contents, once the shipping address has a country and postal code. Carriers' rates need the whole address.
  """
  availableShippingMethods: [ShippingRate!]

  """
  The cart's own billing address, or else the shipping address (billingSameAsShipping). As far as it is filled in.
  """
  billingAddress: Address

  """
  True while the cart has no billing address of its own and bills to the shipping address, the default.
  """
  billingSameAsShipping: Boolean
  checkoutReady: Boolean
  cost: CartCost
  coupons: [CartCoupon!]
  createdAt: DateTime
  currencyCode: CurrencyCode
  customer: Customer
  discounts: [AppliedDiscount!]
  email: EmailAddress
  id: ID!

  """False once the cart became an order."""
  isOpen: Boolean
  lines: [CartLine!]
  locale: LocaleCode

  """Empty when the cart can be checked out."""
  missing: [CartRequirement!]
  order: Order
  requiresShipping: Boolean
  selectedPaymentMethod: PaymentMethodOption

  """The shopper's choice while it is available, else the cheapest rate."""
  selectedShippingMethod: ShippingRate

  """As far as it is filled in."""
  shippingAddress: Address
  totalQuantity: Int
  updatedAt: DateTime

  """Increments on every change."""
  version: Int
}

"""Exactly one: an address, or a saved address of the signed-in customer."""
input CartAddressInput @oneOf {
  address: AddressInput
  customerAddressId: ID
}

union CartAssignToCustomerResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

input CartBillingAddressInput @oneOf {
  address: AddressInput
  customerAddressId: ID
  sameAsShipping: Boolean
}

union CartBillingAddressSetResult = AuthenticationError | CartPayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

"""
Totals from the pricing pipeline: subtotal → discounts → shipping → shipping discount → tax → total.
"""
