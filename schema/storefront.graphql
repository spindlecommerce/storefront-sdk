  """Line discounts plus shipping discount."""
  discountTotal: Money
  pricesIncludeTax: Boolean

  """After shipping discounts."""
  shipping: Money
  shippingDiscount: Money
  subtotal: Money
  tax: Money
  taxLines: [TaxLine!]
  total: Money
}

type CartCoupon {
  applied: Boolean
